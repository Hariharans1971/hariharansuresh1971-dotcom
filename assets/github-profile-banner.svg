<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Hariharan S. — Python, Backend and Applied AI</title>
  <desc id="desc">A modern navy and teal technology banner with a subtle connected-node pattern and a clean typographic headline.</desc>
